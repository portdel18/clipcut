# ClipCut for Windows: tests the engine façade, builds the app and its installer, runs the
# packaged app's self-test (open, preview, sound, export) and a captions test with a real speech
# model on Windows, and uploads the installer.
name: ClipCut Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipcut-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clipcut-windows

      - name: ffmpeg (test clips only; never shipped)
        shell: pwsh
        run: |
          # Chocolatey's community feed sometimes fails (or answers 503) and choco then exits 1 or
          # even 0 without ffmpeg, so check that ffmpeg runs, and fall back to a static build from
          # GitHub. The step ends with ffmpeg itself: GitHub fails a pwsh step on the exit code of
          # the last program it ran, which would otherwise be choco's.
          choco install ffmpeg --no-progress -y
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Output "Chocolatey didn't install ffmpeg; using a static build instead"
            $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
            $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            if (-not $bin) { throw "the static ffmpeg build has no ffmpeg.exe" }
            Add-Content $env:GITHUB_PATH $bin
            $env:PATH = "$bin;$env:PATH"
          }
          ffmpeg -hide_banner -version | Select-Object -First 1

      - name: Test clipcut-core
        # tests that need ffmpeg fail rather than skip without it
        env:
          FILMCRAFT_REQUIRE_ORACLES: "1"
        run: cargo test --release -p clipcut-core

      - name: Build ClipCut and its installer
        working-directory: apps/clipcut
        run: npx --yes @tauri-apps/cli@2 build --ci

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $clip = "$env:RUNNER_TEMP\selftest-in.mp4"
          ffmpeg -v error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=5" -f lavfi -i "sine=frequency=440:duration=5:sample_rate=48000" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest $clip
          # Cargo builds clipcut.exe; the Tauri CLI may name it after the product
          $exe = @("target\release\ClipCut.exe", "target\release\clipcut.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "the built app was not found in target\release" }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", $clip, "$env:RUNNER_TEMP\selftest-out.mp4", "selftest-report.json" -Wait -PassThru -NoNewWindow
          Get-Content selftest-report.json
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Export through Media Foundation's encoder
        shell: pwsh
        run: |
          # The path Intel Quick Sync and other GPUs' H.264 encoders take (Media Foundation), with
          # Microsoft's software encoder MFT standing in for the hardware one (this runner has no
          # GPU), against ClipCut's own encoder: both must decode cleanly, every frame there, and
          # look like the source.
          $clip = "$env:RUNNER_TEMP\speed-in.mp4"
          ffmpeg -v error -y -f lavfi -i "testsrc2=size=1080x1920:rate=30:duration=20" -f lavfi -i "sine=frequency=440:duration=20:sample_rate=48000" -vf "noise=alls=12:allf=t" -c:v libx264 -preset veryfast -b:v 10M -pix_fmt yuv420p -c:a aac -shortest $clip
          $exe = @("target\release\ClipCut.exe", "target\release\clipcut.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          foreach ($mode in @("hardware", "software")) {
            if ($mode -eq "hardware") { $env:FILMCRAFT_MF_SOFTWARE_ENCODER = "1" } else { Remove-Item Env:\FILMCRAFT_MF_SOFTWARE_ENCODER -ErrorAction SilentlyContinue }
            $out = "$env:RUNNER_TEMP\export-$mode.mp4"
            $p = Start-Process -FilePath $exe -ArgumentList "--export-test", $clip, $out, "export-$mode.json", $mode -Wait -PassThru -NoNewWindow
            Get-Content "export-$mode.json"
            if ($p.ExitCode -ne 0) { throw "the $mode export failed (exit $($p.ExitCode))" }
            $r = Get-Content "export-$mode.json" -Raw | ConvertFrom-Json
            $errs = ffmpeg -v error -i $out -f null - 2>&1 | Out-String
            if ($errs.Trim()) { throw "the $mode export doesn't decode cleanly: $errs" }
            $n = (ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 $out | Out-String).Trim()
            if ($n -ne "600") { throw "the $mode export has $n frames, not 600" }
            $line = ffmpeg -i $out -i $clip -lavfi "[0:v][1:v]psnr" -f null - 2>&1 | Out-String
            $m = [regex]::Match($line, "average:([0-9.]+|inf)")
            if (-not $m.Success) { throw "no PSNR for the $mode export: $line" }
            $psnr = if ($m.Groups[1].Value -eq "inf") { 99 } else { [double]$m.Groups[1].Value }
            Write-Output "$mode export: $([math]::Round($r.seconds, 1)) s, $([math]::Round($r.fps, 1)) fps, PSNR $psnr dB against the source, $($r.hardwareFrames) pictures through Media Foundation"
            if ($psnr -lt 28) { throw "the $mode export looks wrong: PSNR $psnr dB" }
            if ($mode -eq "hardware" -and $r.hardwareFrames -lt 600) { throw "Media Foundation encoded only $($r.hardwareFrames) of 600 pictures" }
            if ($mode -eq "software" -and $r.hardwareFrames -ne 0) { throw "the software export went through a hardware encoder" }
          }
          Remove-Item Env:\FILMCRAFT_MF_SOFTWARE_ENCODER -ErrorAction SilentlyContinue

      - name: Speech model cache (Whisper tiny, for the captions test)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: clipcut-speech-whisper-tiny-v1

      - name: Auto-captions with a real speech model
        shell: pwsh
        run: |
          # Windows' own voice reads a sentence; ClipCut captions it with Whisper tiny
          Add-Type -AssemblyName System.Speech
          $tts = New-Object System.Speech.Synthesis.SpeechSynthesizer
          if ($tts.GetInstalledVoices().Count -eq 0) {
            Write-Output "::warning::this runner has no text-to-speech voice, so the real-speech captions test can't run"
            exit 0
          }
          $wav = "$env:RUNNER_TEMP\speech.wav"
          $tts.SetOutputToWaveFile($wav)
          $tts.Speak("Thanks for having me. I think the city is ready for this change. We started the plan two years ago, and the money is finally there.")
          $tts.Dispose()
          $clip = "$env:RUNNER_TEMP\speech.mp4"
          ffmpeg -v error -y -f lavfi -i "testsrc2=size=1280x720:rate=30" -i $wav -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest $clip
          $exe = @("target\release\ClipCut.exe", "target\release\clipcut.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $p = Start-Process -FilePath $exe -ArgumentList "--caption-test", $clip, "$env:RUNNER_TEMP\models", "whisper-tiny", "caption-report.json", "captions.srt" -Wait -PassThru -NoNewWindow
          Get-Content caption-report.json
          if ($p.ExitCode -ne 0) { throw "the captions test failed (exit $($p.ExitCode))" }
          Get-Content captions.srt
          $heard = (Get-Content caption-report.json -Raw).ToLower()
          foreach ($w in @("city", "change", "money")) {
            if (-not $heard.Contains($w)) { throw "Whisper didn't hear '$w'" }
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipCut-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            selftest-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Update to a newer release, end to end
        shell: pwsh
        run: |
          # The installed ClipCut updates itself as the Update button does (no update key, like a
          # release built without one): it finds a newer release, downloads it, checks its SHA-256,
          # closes, the installer puts the new version in, and ClipCut starts again. The release is
          # served from this runner (CLIPCUT_UPDATE_TEST) instead of GitHub.
          $old = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          $oldCopy = "$env:RUNNER_TEMP\ClipCut-current-setup.exe"
          Copy-Item $old.FullName $oldCopy
          $cur = [regex]::Match((Get-Content apps\clipcut\Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          $p = $cur.Split('.'); $new = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"
          Write-Output "updating $cur -> $new"

          # the newer version: the same app, built as $new
          @{ version = $new } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\newer.json"
          Push-Location apps\clipcut
          npx --yes @tauri-apps/cli@2 build --ci --config "$env:RUNNER_TEMP\newer.json"
          if ($LASTEXITCODE -ne 0) { throw "building $new failed" }
          Pop-Location
          $newInst = Get-ChildItem "target\release\bundle\nsis\*_$($new)_*-setup.exe" | Select-Object -First 1
          if (-not $newInst) { throw "the $new installer was not found" }

          # install the current version, as a person would
          $p = Start-Process $oldCopy -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installing $cur failed (exit $($p.ExitCode))" }
          $installed = "$env:LOCALAPPDATA\ClipCut\ClipCut.exe"
          if (-not (Test-Path $installed)) { throw "ClipCut wasn't installed at $installed" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ClipCut"
          Write-Output "installed: $((Get-ItemProperty $key).DisplayVersion)"

          # "the latest release", as GitHub's API describes it
          $feed = "$env:RUNNER_TEMP\feed"
          New-Item -ItemType Directory -Force $feed | Out-Null
          Copy-Item $newInst.FullName "$feed\setup.exe"
          $sum = (Get-FileHash "$feed\setup.exe" -Algorithm SHA256).Hash.ToLower()
          @{
            tag_name = "v$new"
            body = "Test release"
            assets = @(@{ name = $newInst.Name; browser_download_url = "http://127.0.0.1:8765/setup.exe"; size = $newInst.Length; digest = "sha256:$sum" })
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM "$feed\latest"
          $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", $feed -PassThru -WindowStyle Hidden
          Start-Sleep 3

          $log = "$env:TEMP\ClipCut update\test.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:CLIPCUT_UPDATE_TEST = "http://127.0.0.1:8765/latest"
          $app = Start-Process $installed -PassThru
          Remove-Item Env:\CLIPCUT_UPDATE_TEST
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 5
            $v = (Get-ItemProperty $key -ErrorAction SilentlyContinue).DisplayVersion
            $again = Get-Process ClipCut -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $app.Id }
            if ($v -eq $new -and $app.HasExited -and $again) { $ok = $true; break }
          }
          Write-Output "--- the app's update log"
          if (Test-Path $log) { Get-Content $log } else { Write-Output "(none)" }
          Write-Output "--- installed version: $v; the $cur app closed: $($app.HasExited); ClipCut running again: $([bool]$again)"
          Write-Output "exe version: $((Get-Item $installed).VersionInfo.ProductVersion)"
          Get-Process ClipCut -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "ClipCut didn't update itself from $cur to $new and start again" }

      - name: Upload the captions test's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClipCut-captions-test
          path: |
            caption-report.json
            captions.srt
          if-no-files-found: warn
          retention-days: 30
