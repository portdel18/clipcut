[package]
name = "clipcut"
description = "ClipCut: a CapCut-style desktop video editor on the FilmCraft engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "clipcut"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clipcut-core = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-platform = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-time = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# updates without a signing key: the latest release's installer, from GitHub (the same client and
# TLS the updater plugin uses)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
sha2 = "0.10"
minisign-verify = "0.3"
base64 = "0.22"
cpal = "0.16"
serde = { workspace = true }
serde_json = { workspace = true }

# The GPU export renderer (filmcraft-gpu) needs a wgpu backend, which that crate leaves to the
# application: without one there is no adapter and every export composites on the CPU.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
