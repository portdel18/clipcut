<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipCut</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="logo.png" alt="" width="22" height="22"><span>ClipCut</span></div>
    <div class="title" id="clip-title">No clip open</div>
    <div class="top-actions">
      <button class="btn primary" id="export-btn" disabled>Export</button>
    </div>
  </header>

  <aside class="library" aria-label="Library">
    <nav class="rail" role="tablist" aria-label="Library tabs">
      <button class="rail-tab" role="tab" id="tab-media" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg><span>Media</span></button>
      <button class="rail-tab" role="tab" aria-selected="false" disabled title="Coming in Phase 1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><span>Audio</span></button>
      <button class="rail-tab" role="tab" aria-selected="false" disabled title="Coming in Phase 1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M12 6v13M8 19h8"/></svg><span>Text</span></button>
      <button class="rail-tab" role="tab" aria-selected="false" disabled title="Coming in Phase 1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 14h4M13 14h4M7 11h10"/></svg><span>Captions</span></button>
      <button class="rail-tab" role="tab" aria-selected="false" disabled title="Coming in Phase 2: Clip Studio's lower thirds, maps and more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="14" width="13" height="5" rx="1"/><path d="M3 10h18M3 6h9"/></svg><span>Graphics</span></button>
    </nav>
    <section class="panel" id="panel-media" role="tabpanel" aria-labelledby="tab-media">
      <h2>Media</h2>
      <button class="import" id="import-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <strong>Import</strong>
        <span>or drop a video anywhere on the window</span>
      </button>
      <div class="media-list" id="media-list"></div>
      <p class="hint">This first version opens one clip at a time. Splitting, trimming and more tracks arrive in Phase 1.</p>
    </section>
  </aside>

  <main class="player" aria-label="Player">
    <div class="stage" id="stage">
      <canvas id="preview" aria-label="Preview"></canvas>
      <div class="empty" id="empty">
        <p>Import a video to start</p>
        <button class="btn" id="empty-import">Import</button>
      </div>
    </div>
    <div class="transport">
      <span class="tc"><span id="tc-now">00:00:00</span> <span class="tot">/ <span id="tc-total">00:00:00</span></span></span>
      <button class="play" id="play-btn" aria-label="Play" disabled>
        <svg viewBox="0 0 24 24" id="play-icon" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <span class="note" id="sound-note"></span>
    </div>
  </main>

  <aside class="details" aria-label="Details">
    <h2>Details</h2>
    <dl id="details">
      <div><dt>Clip</dt><dd>None</dd></div>
    </dl>
  </aside>

  <section class="timeline" aria-label="Timeline">
    <div class="tl-tools">
      <button class="tool" disabled title="Split (Phase 1)" aria-label="Split"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M7 8l5-5 5 5"/></svg></button>
      <button class="tool" disabled title="Delete (Phase 1)" aria-label="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
      <span class="spacer"></span>
      <label class="zoom"><span>Zoom</span><input type="range" id="zoom" min="0" max="100" value="0"></label>
    </div>
    <div class="tl-scroll" id="tl-scroll">
      <div class="tl-content" id="tl-content">
        <div class="ruler" id="ruler"></div>
        <div class="track main-track" id="track"><div class="track-empty">Drop a video here</div></div>
        <div class="playhead" id="playhead"><span></span></div>
      </div>
    </div>
  </section>
</div>

<div class="drop-veil" id="drop-veil"><p>Drop to open</p></div>
<div class="toast" id="toast" role="status" hidden></div>

<dialog class="dlg" id="export-dlg" aria-labelledby="export-title">
  <h2 id="export-title">Exporting</h2>
  <p class="path" id="export-path"></p>
  <div class="bar"><div id="export-bar"></div></div>
  <p class="meta" id="export-meta">Starting…</p>
  <div class="dlg-actions">
    <button class="btn" id="export-cancel">Cancel</button>
    <button class="btn" id="export-reveal" hidden>Show in folder</button>
    <button class="btn primary" id="export-close" hidden>Done</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
